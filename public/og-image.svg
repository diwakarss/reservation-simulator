<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0221"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars/dots -->
  <circle cx="100" cy="100" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="300" cy="80" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="500" cy="150" r="2" fill="#ffffff" opacity="0.2"/>
  <circle cx="700" cy="50" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="900" cy="120" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="1100" cy="90" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="150" cy="500" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="350" cy="550" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="850" cy="520" r="2" fill="#ffffff" opacity="0.2"/>
  <circle cx="1050" cy="480" r="1.5" fill="#ffffff" opacity="0.3"/>

  <!-- Title -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#22d3ee">RESERVATION</text>
  <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#22d3ee">SIMULATOR</text>

  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#a7a7c4">Experience policy outcomes across 5 fictional social classes</text>

  <!-- Stats boxes -->
  <rect x="200" y="420" width="200" height="100" rx="10" fill="#1a1a2e" stroke="#e2b714" stroke-width="2"/>
  <text x="300" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#e2b714">200</text>
  <text x="300" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a7a7c4">YEARS</text>

  <rect x="500" y="420" width="200" height="100" rx="10" fill="#1a1a2e" stroke="#2dd4bf" stroke-width="2"/>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2dd4bf">5</text>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a7a7c4">CLASSES</text>

  <rect x="800" y="420" width="200" height="100" rx="10" fill="#1a1a2e" stroke="#f472b6" stroke-width="2"/>
  <text x="900" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#f472b6">1</text>
  <text x="900" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a7a7c4">OUTCOME</text>

  <!-- URL -->
  <text x="600" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#666666">reservationsim.jdlabs.top</text>
